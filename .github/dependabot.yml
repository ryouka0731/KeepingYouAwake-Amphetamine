# Keeps the commit-SHA–pinned GitHub Actions and the hash-pinned CI Python
# locks current: Dependabot rewrites the SHA plus its `# vX.Y.Z` comment,
# and the pinned versions plus their hashes. Security alerts for the Swift
# packages are handled by Dependabot's default security updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    groups:
      ci-python:
        patterns: ["*"]
